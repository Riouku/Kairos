      <path d="M78 211c-20-24-29-56-26-91 2-22 9-42 21-59-7 22-9 41-7 60 3 33 14 59 31 77l-19 13Z"/>
      <path d="M162 211c20-24 29-56 26-91-2-22-9-42-21-59 7 22 9 41 7 60-3 33-14 59-31 77l19 13Z"/>
      <path d="M64 167c-12 2-22-3-29-15 14-1 24 4 29 15Zm-4-23c-13-2-21-10-23-23 13 2 21 10 23 23Zm2-24c-12-5-18-15-16-28 12 5 18 15 16 28Zm7-24c-10-8-13-19-8-31 10 8 13 19 8 31Zm11-22c-7-11-7-22 0-33 7 11 7 22 0 33Zm-9 101c-12 1-21-4-26-15 12 0 21 5 26 15Zm12 17c-11 4-21 1-28-9 12-3 21 0 28 9Z"/>
      <path d="M176 167c12 2 22-3 29-15-14-1-24 4-29 15Zm4-23c13-2 21-10 23-23-13 2-21 10-23 23Zm-2-24c12-5 18-15 16-28-12 5-18 15-16 28Zm-7-24c10-8 13-19 8-31-10 8-13 19-8 31Zm-11-22c7-11 7-22 0-33-7 11-7 22 0 33Zm9 101c12 1 21-4 26-15-12 0-21 5-26 15Zm-12 17c11 4 21 1 28-9-12-3-21 0-28 9Z"/>
    </g>
    <path d="M75 210c14 12 29 21 45 29 16-8 31-17 45-29" fill="none" stroke="#F4D98F" stroke-linecap="round" stroke-width="2.2"/>

    <!-- Central medallion and Imperial initial. -->
