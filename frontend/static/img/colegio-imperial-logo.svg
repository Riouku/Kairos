    <circle cx="120" cy="132" r="40" fill="none" stroke="#F4D98F" stroke-opacity=".65" stroke-width="1.3"/>
    <path d="M97 101h46v9h-16v45h16v9H97v-9h16v-45H97v-9Z" fill="url(#gold)" stroke="#F9E9BC" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M108 177h24" stroke="#F4D98F" stroke-linecap="round" stroke-width="2"/>
