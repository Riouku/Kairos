<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-labelledby="title desc">
  <title id="title">Escudo del Colegio Imperial</title>
  <desc id="desc">Escudo azul marino con bordes dorados, laureles y una I clásica en el centro.</desc>
  <defs>
    <linearGradient id="shield" x1="34" y1="20" x2="198" y2="253" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35558F"/>
      <stop offset=".52" stop-color="#203D73"/>
      <stop offset="1" stop-color="#142A52"/>
    </linearGradient>
    <linearGradient id="gold" x1="52" y1="43" x2="184" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6DB8D"/>
      <stop offset=".48" stop-color="#D8B45D"/>
      <stop offset="1" stop-color="#B98735"/>
    </linearGradient>
    <filter id="shadow" x="3" y="3" width="234" height="275" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

