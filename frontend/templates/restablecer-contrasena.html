<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restablecer contraseña - Colegio Kairos</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/kairos-logo.svg">
    <link rel="stylesheet" href="/static/css/styles.css?v=guardian-reports-v1">
  </head>
  <body data-page="reset-password" class="login-page">
    <main class="login-shell">
      <section class="login-brand">
        <img class="login-logo" src="/static/img/kairos-logo.svg" alt="Colegio Kairos">
        <p>Intranet Escolar</p><h1>Colegio Kairos</h1><span>Recuperación de cuenta</span>
      </section>
      <section class="login-card">
        <div><p class="section-kicker">Seguridad</p><h2>Nueva contraseña</h2></div>
        <form id="reset-password-form" class="form-grid single">
          <label>Nueva contraseña<input id="reset-password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required></label>
          <label>Repetir contraseña<input id="reset-password-confirm" type="password" minlength="10" maxlength="200" autocomplete="new-password" required></label>
          <button class="button button-blue" type="submit">Guardar contraseña</button>
        </form>
        <p id="reset-password-message" class="message hidden"></p>
      </section>
    </main>
    <script src="/static/js/main.js?v=guardian-reports-v1"></script>
  </body>
</html>
