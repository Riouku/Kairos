<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Retiros de estudiantes - Kairos</title><link rel="stylesheet" href="/static/css/styles.css"></head><body><main style="max-width:1100px;margin:32px auto;padding:24px;background:white;border-radius:18px"><a href="index.html">← Inicio</a><h1>Retiros de estudiantes</h1><p id="msg"></p><nav><a href="index.html">Inicio</a> · <a href="biblioteca.html">Biblioteca</a> · <a href="retiros.html">Retiros</a></nav><p>Registra el retiro del alumno, la persona que lo retira y quién lo autoriza.</p><form id="form"><label>Estudiante<select name="estudiante_id" id="students" required></select></label><label>Retirado por<input name="retirado_por" required maxlength="150"></label><label>Autorizado por<input name="autorizado_por" required maxlength="150"></label><label>Motivo (opcional)<textarea name="motivo"></textarea></label><button>Registrar retiro ahora</button></form><h2>Historial reciente</h2><div id="rows"></div><script>
if(!sessionStorage.getItem('kairos-user')) location.href='login.html';
const API=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'http://localhost:8000/api':'/api';
async function req(path,opts={}){let r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opts});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'No se pudo guardar');return d}
function say(x){document.querySelector('#msg').textContent=x}

async function load(){try{let [s,rows]=await Promise.all([req('/estudiantes?activo=true'),req('/retiros')]);document.querySelector('#students').innerHTML=s.map(x=>`<option value="${x.id}">${x.nombre} ${x.apellido} — ${x.curso_nombre||''}</option>`).join('');document.querySelector('#rows').innerHTML='<ul>'+rows.map(x=>`<li>${new Date(x.fecha_hora).toLocaleString()} — ${x.estudiante} (${x.curso}); retiró ${x.retirado_por}, autorizado por ${x.autorizado_por}${x.motivo?'; '+x.motivo:''}</li>`).join('')+'</ul>'}catch(e){say(e.message)}}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{let d=Object.fromEntries(new FormData(e.target));d.estudiante_id=Number(d.estudiante_id);await req('/retiros',{method:'POST',body:JSON.stringify(d)});say('Retiro guardado.');e.target.reset();await load()}catch(x){say(x.message)}};load();</script></main></body></html>
