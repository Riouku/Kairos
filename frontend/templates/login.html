<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Colegio Imperial - Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="stylesheet" href="/static/css/styles.css">
  </head>
  <body data-page="login" class="login-page">
    <main class="login-shell">
      <section class="login-brand">
          <img class="login-logo" src="/static/img/colegio-imperial-logo.svg" alt="Colegio Imperial">
        <p>Intranet Escolar</p>
        <h1>Colegio Imperial</h1>
        <span>Gestión académica y administrativa</span>
      </section>

      <section class="login-card">
        <div>
          <p class="section-kicker">Acceso administrativo</p>
          <h2>Iniciar sesión</h2>
        </div>
        <form id="login-form" class="form-grid single">
          <label>Correo electrónico<input id="login-email" type="email" value="manuelgarridos2002@kairos.cl" autocomplete="username" required></label>
          <label>Contraseña<input id="login-password" type="password" value="" autocomplete="current-password" required></label>
          <button class="button button-blue" type="submit">Entrar al panel</button>
        </form>
        <p id="login-message" class="message hidden"></p>
      </section>
    </main>
    <script src="/static/js/main.js?v=rpc-v4"></script>
  </body>
</html>
