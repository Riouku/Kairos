[project]
name = "kairos"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn==0.47.0",
  "sqlalchemy==2.0.49",
  "pg8000==1.31.5",
  "python-dotenv==1.2.2",
  "alembic==1.18.4",
  "pydantic-settings==2.14.1",
  "email-validator==2.3.0",
  "httpx==0.28.1",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "python scripts/build_vercel.py"
